# /etc/nginx/sites-available/markus (symlinked into sites-enabled)
# Static investor page with its own login (user Markus); nothing else of Market Trends is reachable here.
server {
    listen 8446 ssl;
    server_name geniscent.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/geniscent.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geniscent.duckdns.org/privkey.pem;

    root /opt/markus-site;
    index index.html;

    auth_basic "GeniScent Marktanalyse";
    auth_basic_user_file /etc/nginx/markus.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
