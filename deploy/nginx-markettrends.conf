# /etc/nginx/sites-available/markettrends (symlinked into sites-enabled)
server {
    listen 8445 ssl;
    server_name geniscent.duckdns.org;
    client_max_body_size 5M;

    ssl_certificate     /etc/letsencrypt/live/geniscent.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geniscent.duckdns.org/privkey.pem;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
