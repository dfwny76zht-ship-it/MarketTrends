name: markettrends

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: markettrends
      POSTGRES_USER: markettrends
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markettrends -d markettrends"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://markettrends:${POSTGRES_PASSWORD}@db:5432/markettrends
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      - snapshots:/data/snapshots
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  snapshots:
